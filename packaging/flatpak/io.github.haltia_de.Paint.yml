# Раскраска as a Flatpak: flatpak-builder --user --install build packaging/flatpak/io.github.haltia_de.Paint.yml
# Python 3, PyGObject, GTK 3 and pycairo come with the GNOME runtime;
# haltia-kit is its module (haltia-kit.yml, a copy of the one in
# haltia-de/kit); numpy, scipy and Pillow are wheels at the versions of
# requirements.txt, for the runtime's Python 3.14. Own pictures come from
# XDG Pictures (read and written: Раскраски, Мои раскраски) or the file
# chooser portal. Built from this checkout (CI checks out the tag).
id: io.github.haltia_de.Paint
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: haltia-paint
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures
modules:
  - haltia-kit.yml
  - name: python3-pbn
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps numpy scipy pillow
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/f3/eb/ebffaa97dc55502df69584a8f0dcf07f69a3e0b3e2323670a2722db9aa39/numpy-2.4.6-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: a2c306dea656c12c68f51f4cea133cbe78ca7435eb28c735eac1d3ebe73be6e8
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/d5/91/64288395ee1799bd2e0b04a305dce9666da90c961e1f3fe982a05ee1c036/numpy-2.4.6-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 40fdc1ae7125e518ea98e53e69a4ebc27e1fd50510c47b7ea130cf21e5e1d42b
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/0b/2e/7eea398450457ecb54e18e9d10110993fa65561c4f3add5e8eccd2b9cd41/scipy-1.17.1-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: eee2cfda04c00a857206a4330f0c5e3e56535494e30ca445eb19ec624ae75118
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/ef/f2/7cdb8eb308a1a6ae1e19f945913c82c23c0c442a462a46480ce487fdc0ac/scipy-1.17.1-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: adb2642e060a6549c343603a3851ba76ef0b74cc8c079a9a58121c7ec9fe2350
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/11/8d/d2532ad2a603ca2b93ad9f5135732124e57811d0168155852f37fbce2458/pillow-12.2.0-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 4bfd07bc812fbd20395212969e41931001fd59eb55a60658b0e5710872e95286
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/f6/35/577e22b936fcdd66537329b33af0b4ccfefaeabd8aec04b266528cddb33c/pillow-12.2.0-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 8cbeb542b2ebc6fcdacabf8aca8c1a97c9b3ad3927d46b8723f9d4f033288a0f
  - name: haltia-paint
    buildsystem: simple
    build-commands:
      - install -D -m 755 haltia-paint /app/bin/haltia-paint
      - install -D -m 644 pbn.py /app/lib/haltia-paint/pbn.py
      - install -D -m 644 -t /app/lib/haltia-paint/haltia_paint haltia_paint/*.py
      - install -D -m 644 -t /app/share/haltia-paint pictures/*.svgz
      - install -D -m 644 data/io.github.haltia_de.Paint.desktop /app/share/applications/io.github.haltia_de.Paint.desktop
      - install -D -m 644 data/io.github.haltia_de.Paint.svg /app/share/icons/hicolor/scalable/apps/io.github.haltia_de.Paint.svg
      - install -D -m 644 data/io.github.haltia_de.Paint.metainfo.xml /app/share/metainfo/io.github.haltia_de.Paint.metainfo.xml
    sources:
      - type: dir
        path: ../..
